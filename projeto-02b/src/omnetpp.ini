# C:\projects\TR\projeto\projeto-02b\src\omninetpp.ini
[General]
[Config Wireless001]
network = src.recording
description = Comunicação entre 2 hosts Wireless com um jammer no meio
sim-time-limit = 20s
output-scalar-file = results.sca
output-vector-file = results.vec
record-eventlog = true

# Rede
*.host*.ipv4.arp.typename = "GlobalArp" #*.host*.networkLayer.arpType = "GlobalArp"

# -----------------------------
# Aplicativo de envio (hostA)
# -----------------------------
*.hostA.numApps = 1
*.hostA.app[0].typename = "UdpBasicApp"
*.hostA.app[0].destAddresses = "hostB"
*.hostA.app[0].messageLength = 1000B
*.hostA.app[0].sendInterval = exponential(12ms)
*.hostA.app[0].packetName = "UDPdata"
*.hostA.app[0].destPort = 5000

# Aplicativo de recepção (hostB)
*.hostB*.numApps = 1
*.hostB.app[0].typename = "UdpSink"
*.hostB.app[0].localPort = 5000

# -----------------------------
# Configuração de NIC e Rádio
# -----------------------------
# *.host*.wlan[0].typename = "AckingWirelessInterface"
*.host*.wlan[0].mac.useAck = false
*.host*.wlan[0].radio.receiver.ignoreInterference = false  # para o jammer ter efeito
*.host*.wlan[0].radio.typename = "ApskDimensionalRadio"
*.host*.**.bitrate = 1Mbps
*.host*.wlan[0].radio.centerFrequency = 2.4GHz
*.host*.wlan[0].radio.bandwidth = 20MHz

# Transmissor
#*.host*.wlan[0].radio.transmitter.typename = "ApskDimensionalTransmitter"
*.host*.wlan[0].radio.transmitter.power = 2mW
*.host*.wlan[0].radio.transmitter.preambleDuration = 20us
*.host*.wlan[0].radio.transmitter.headerLength = 24bit

# Receptor
#*.host*.wlan[0].radio.receiver.typename = "ApskDimensionalReceiver"
*.host*.wlan[0].radio.receiver.snirThreshold = 4dB
*.host*.wlan[0].radio.receiver.energyDetection = -85dBm
*.host*.wlan[0].radio.receiver.sensitivity = -90dBm
*.host*.wlan[0].radio.receiver.centerFrequency = 2.4GHz

############################# SETANDO O JAMMER
#*.jammer.transmitter.typename = "NoiseDimensionalTransmitter"
#*.jammer.transmitter.power = 10mW
#*.jammer.transmitter.bandwidth = 20MHz
#*.jammer.transmitter.centerFrequency = 2.4GHz
#*.jammer.transmitter.duration = 0.0001s
#*.jammer.sleepInterval = 1s

*.hostA.wlan[0].radio.typename = "ApskDimensionalRadio"
*.hostA.wlan[0].radio.transmitter.typename = "ApskDimensionalTransmitter"
*.hostA.wlan[0].radio.receiver.typename = "ApskDimensionalReceiver"

*.hostB.wlan[0].radio.typename = "ApskDimensionalRadio"
*.hostB.wlan[0].radio.transmitter.typename = "ApskDimensionalTransmitter"
*.hostB.wlan[0].radio.receiver.typename = "ApskDimensionalReceiver"

*.radioMedium.centerFrequency = 2.4GHz  # ou 5GHz
*.radioMedium.bandwidth = 20MHz         # largura de banda típica de Wi-Fi
**.radio.interferenceNoisePower.vector-recording = false # trocar isso para testar jammer
*.radioMedium.backgroundNoise.power = -110dBm
